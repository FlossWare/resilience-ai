[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-ai"
version = "0.1"
description = "Standalone resilience primitives for async Python: circuit breakers, retry with backoff, rate limiting, and health tracking."
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Scot P. Floess", email = "sfloess@gmail.com" },
]
readme = "README.md"
keywords = ["resilience", "circuit-breaker", "retry", "rate-limiter", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "bandit"]

[project.urls]
Homepage = "https://github.com/FlossWare/resilience-ai"
Repository = "https://github.com/FlossWare/resilience-ai"
Issues = "https://github.com/FlossWare/resilience-ai/issues"

[tool.setuptools.packages.find]
include = ["resilience_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]
