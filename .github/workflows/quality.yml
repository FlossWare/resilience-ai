name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff Check
        run: ruff check resilience_ai/

      - name: Ruff Format Check
        run: ruff format --check resilience_ai/

  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Run MyPy
        run: mypy resilience_ai/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "bandit[toml]"

      - name: Run Bandit
        run: |
          bandit -r resilience_ai/ -f json -o bandit-report.json || true
          bandit -r resilience_ai/ -f screen

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 90

  complexity:
    name: Complexity Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Radon
        run: |
          python -m pip install --upgrade pip
          pip install radon xenon

      - name: Cyclomatic Complexity
        run: radon cc resilience_ai/ -a -s

      - name: Maintainability Index
        run: radon mi resilience_ai/ -s

      - name: Check Complexity Thresholds
        continue-on-error: true
        run: xenon --max-average B --max-modules B --max-absolute B resilience_ai/
